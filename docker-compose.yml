version: '3.8'

services:
  app:
    build: .
    container_name: rag-app
    depends_on:
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: >
      sh -c "bun install &&
             bun run deepseek-example.ts"

  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379" # For Redis commands
      - "8001:8001" # For RedisInsight
    volumes:
      - redis-data:/data

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt port
    volumes:
      - neo4j-data:/data
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]

  # --- Ollama Service (Optional, for local LLM) ---
  # To enable, uncomment the following lines.
  # You will also need to adjust the application logic to use the Ollama API.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   pull_policy: always
  #   tty: true
  #   restart: always

volumes:
  redis-data:
  neo4j-data:
  ollama-data:
